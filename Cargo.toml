[package]
name = "git-simple-gui"
version = "1.0.2"
edition = "2021"
description = "Git Simple GUI - a clean, dark git client: commit graph, branches, remotes and everyday git actions."
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Pierre Bocquillon"]
repository = "https://github.com/pierreBocquillon/git-simple-gui"

[[bin]]
name = "git-simple-gui"
path = "src/main.rs"

[dependencies]
eframe = "0.31.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.15"
serde_json = "1.0.154"
ureq = "2"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
