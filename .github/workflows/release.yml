# On every push to main: test and build. When the version in Cargo.toml has no release yet,
# also publish a GitHub release tagged v<version> (e.g. v1.2.0) with
#   - GitSimpleGUI-portable.zip  the .exe alone, runs from anywhere
#   - GitSimpleGUI-Setup.exe     the installer (installer/setup.iss)
#
# To publish a new version: raise `version` in Cargo.toml and push to main.
# The app is built with GITHUB_REPOSITORY = owner/name (set by GitHub), so it knows where to look
# for newer versions (see src/update.rs).

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Read the version from Cargo.toml
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          # Already released? Then only test and build (a release needs a new version number).
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v$v is already released: raise the version in Cargo.toml to publish a new one."
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Publishing v$v"
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0

      - name: Portable zip
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/git-simple-gui.exe -DestinationPath dist/GitSimpleGUI-portable.zip

      - name: Installer
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          # Inno Setup is not preinstalled on every Windows runner: install it if needed,
          # then look for its compiler (ISCC.exe) wherever it landed.
          function Find-Iscc {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) {
              $found = Get-ChildItem -Path "${env:ProgramFiles(x86)}", "${env:ProgramFiles}", "$env:ChocolateyInstall\lib" `
                -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            }
            return $found
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup not found: installing it with Chocolatey"
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          Write-Host "Using $iscc"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE (2 = error in installer/setup.iss)" }
          Get-ChildItem dist

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Git Simple GUI ${{ steps.version.outputs.version }}
          body: |
            ${{ github.event.head_commit.message }}
          files: |
            dist/GitSimpleGUI-portable.zip
            dist/GitSimpleGUI-Setup.exe
          make_latest: true
